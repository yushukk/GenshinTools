server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物，可长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 游戏数据资源目录：存在就返回文件，缺失返回真实 404
    # （与项目原 Cloudflare Worker 的 not_found_handling:none 行为保持一致）
    location ~ ^/(artifact|character|element|enemy|food|good|weapon|weapontype)/ {
        try_files $uri =404;
    }

    # SPA 前端路由 fallback：任何未匹配的路径都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
